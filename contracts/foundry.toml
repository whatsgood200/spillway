[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"  # the version the deployed contracts were compiled and verified with
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@reactive/=lib/reactive-lib-omni/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "morpho-blue/=lib/morpho-blue/src/",
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
lasna = "https://lasna-rpc.rnk.dev/"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 80
fail_on_revert = true
